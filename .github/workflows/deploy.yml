name: Public Provider With Nested Reusable Call (branch-ref nested)

on:
  workflow_call:
    secrets:
      consumer_secret:
        required: false

jobs:
  direct-step:
    runs-on: ubuntu-latest
    steps:
      - run: echo "public_provider_marker=NESTED_BRANCHREF_PROVIDER_20260511"

  nested-call:
    # Branch-ref, NOT SHA. With sha_pinning_required=true on the consumer,
    # this nested call should be rejected if the policy is enforced transitively.
    uses: rafcdln/bb-lab-sub-provider/.github/workflows/sub.yml@main
    secrets:
      consumer_secret: ${{ secrets.consumer_secret }}
