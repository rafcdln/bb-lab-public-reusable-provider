name: Public Provider With Nested Reusable Call

on:
  workflow_call:
    secrets:
      consumer_secret:
        required: false

jobs:
  direct-step:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "public_provider_marker=NESTED_CALLER_PROVIDER_20260511"
          echo "runtime_repository=${GITHUB_REPOSITORY}"
          echo "workflow_ref=${GITHUB_WORKFLOW_REF}"

  nested-call:
    # Nested reusable workflow call to a repo NOT in the consumer's allowlist.
    # Consumer only allowlisted: rafcdln/bb-lab-public-reusable-provider/.github/workflows/deploy.yml@<SHA>
    # This calls rafcdln/bb-lab-sub-provider which is NOT in that list.
    uses: rafcdln/bb-lab-sub-provider/.github/workflows/sub.yml@9fbb73a79f7758ee90c673d54ed5fb3505bac869
    secrets:
      consumer_secret: ${{ secrets.consumer_secret }}
